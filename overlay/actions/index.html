<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store">
<title>LiveGift Studio Action</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent!important}
#video{display:none;width:100vw;height:100vh;object-fit:contain;background:transparent}
</style>
</head>
<body>
<video id="video" playsinline></video>
<script>
(() => {
  const slot = Math.max(1, Math.min(10, Number(new URLSearchParams(location.search).get("slot") || 1)));
  const topic = "livegift-actions-isyitamar-4958d5626bf07a3a1ca9741402e21631";
  const mediaUrl = "http://127.0.0.1:17891/media/action/" + slot;
  const video = document.getElementById("video");
  const queue = [];
  let busy = false;

  function finish(){
    try { video.pause(); } catch {}
    video.style.display = "none";
    busy = false;
    setTimeout(playNext, 60);
  }

  function playNext(){
    if (busy || !queue.length) return;
    const event = queue.shift();
    busy = true;
    const src = mediaUrl + "?v=" + encodeURIComponent(event.updated || Date.now());
    if (event.mediaType === "video"){
      video.style.display = "block";
      video.src = src;
      video.currentTime = 0;
      video.onended = finish;
      video.onerror = finish;
      const p = video.play();
      if (p && p.catch) p.catch(finish);
    } else {
      video.style.display = "none";
      const a = new Audio(src);
      a.onended = finish;
      a.onerror = finish;
      const p = a.play();
      if (p && p.catch) p.catch(finish);
    }
  }

  function accept(envelope){
    if (!envelope || envelope.event !== "message" || !envelope.message) return;
    let data;
    try { data = JSON.parse(envelope.message); } catch { return; }
    if (!data || data.type !== "action" || Number(data.slot) !== slot) return;
    queue.push(data);
    playNext();
  }

  const es = new EventSource("https://ntfy.sh/" + topic + "/sse?since=now");
  es.onmessage = e => { try { accept(JSON.parse(e.data)); } catch {} };
})();
</script>
</body>
</html>
