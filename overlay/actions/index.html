<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store">
<title>LiveGift Studio Action</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent!important}
video{display:none;width:100vw;height:100vh;object-fit:contain;background:transparent}
</style>
</head>
<body>
<video id="video" playsinline></video>
<script>
(() => {
  const slot = Math.max(1, Math.min(10, Number(new URLSearchParams(location.search).get("slot") || 1)));
  const topic = "livegift-actions-isyitamar-4958d5626bf07a3a1ca9741402e21631";
  const localBase = "http://127.0.0.1:17891";
  const video = document.getElementById("video");
  const queue = [];
  let busy = false;
  let activeAudio = null;
  let objectUrl = "";

  document.addEventListener("contextmenu", e => e.preventDefault());

  function cleanupObjectUrl(){
    if(objectUrl){ try{URL.revokeObjectURL(objectUrl)}catch{}; objectUrl=""; }
  }

  function finish(){
    try { video.pause(); } catch {}
    try { if(activeAudio) activeAudio.pause(); } catch {}
    activeAudio = null;
    video.removeAttribute("src");
    video.load();
    video.style.display = "none";
    cleanupObjectUrl();
    busy = false;
    setTimeout(playNext, 80);
  }

  async function getPlayableUrl(event){
    const direct = localBase + "/media/action/" + slot + "?v=" + encodeURIComponent(event.updated || Date.now());
    try{
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 12000);
      const r = await fetch(direct, {mode:"cors", cache:"no-store", credentials:"omit", signal:controller.signal});
      clearTimeout(timer);
      if(!r.ok) throw new Error("Local media returned " + r.status);
      const blob = await r.blob();
      objectUrl = URL.createObjectURL(blob);
      return objectUrl;
    }catch(e){
      return direct;
    }
  }

  async function playNext(){
    if (busy || !queue.length) return;
    const event = queue.shift();
    busy = true;
    const src = await getPlayableUrl(event);
    if (event.mediaType === "video"){
      video.style.display = "block";
      video.src = src;
      video.currentTime = 0;
      video.onended = finish;
      video.onerror = finish;
      try{
        const p = video.play();
        if (p && p.catch) await p;
      }catch{ finish(); }
    } else {
      video.style.display = "none";
      const a = new Audio();
      activeAudio = a;
      a.preload = "auto";
      a.src = src;
      a.onended = finish;
      a.onerror = finish;
      try{
        const p = a.play();
        if (p && p.catch) await p;
      }catch{ finish(); }
    }
  }

  function accept(envelope){
    if (!envelope || envelope.event !== "message" || !envelope.message) return;
    let data;
    try { data = JSON.parse(envelope.message); } catch { return; }
    if (!data || data.type !== "action" || Number(data.slot) !== slot) return;
    queue.push(data);
    playNext();
  }

  const es = new EventSource("https://ntfy.sh/" + topic + "/sse?since=now");
  es.onmessage = e => { try { accept(JSON.parse(e.data)); } catch {} };
})();
</script>
</body>
</html>
