<!doctype html><html lang="he"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>Weekly TopGifters</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent!important;overflow:hidden;font-family:Inter,"Segoe UI",Arial,sans-serif}.stage{width:100vw;height:100vh;display:grid;place-items:center;padding:24px}.card{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 34px;max-width:92vw}.img{width:160px;height:160px;display:grid;place-items:center;filter:drop-shadow(0 14px 26px #0006)}.img img{width:100%;height:100%;object-fit:contain}.fallback{font-size:94px}.name{max-width:700px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff;font-size:39px;font-weight:950;text-shadow:0 3px 14px #000}.coins{color:#f5e500;font-size:29px;font-weight:1000;text-shadow:0 2px 11px #000}.giftname{margin-top:8px;color:#ffffffd6;font-size:13px;font-weight:750;text-shadow:0 2px 8px #000}.empty{display:flex;flex-direction:column;align-items:center;text-align:center;color:#fff}.empty .logo{font-size:82px;line-height:1;color:#fff;text-shadow:-4px 0 #25F4EE,4px 0 #FE2C55}.empty b{color:#f5e500;font-size:29px}.empty span{margin-top:7px;font-size:18px;font-weight:850;direction:rtl}.hidden{display:none!important}.pop{animation:pop .38s cubic-bezier(.2,.9,.25,1)}@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.9)}to{opacity:1;transform:none}}
</style></head><body><div class="stage"><div id="empty" class="empty"><div class="logo">♪</div><b>0 coins</b><span>לא נשלחה מתנה השבוע</span></div><div id="card" class="card hidden"><div id="img" class="img"><div class="fallback">🎁</div></div><div id="name" class="name"></div><div id="coins" class="coins"></div><div id="giftname" class="giftname"></div></div></div><script>
(()=>{const base="https://ntfy.sh/livegift-weekly-isyitamar-v1";let entries=[],i=0,timer=null,sig="";const E=id=>document.getElementById(id),empty=E("empty"),card=E("card"),img=E("img"),name=E("name"),coins=E("coins"),giftname=E("giftname");function show(){if(!entries.length){empty.classList.remove("hidden");card.classList.add("hidden");return}const d=entries[i];empty.classList.add("hidden");card.classList.remove("hidden");card.classList.remove("pop");void card.offsetWidth;card.classList.add("pop");name.textContent=d.username||"Viewer";const n=Number(d.coins||0);coins.textContent=n.toLocaleString()+" "+(n===1?"coin":"coins");giftname.textContent=d.giftName||"Gift";img.innerHTML="";if(d.image&&/^(https?:\/\/|data:image\/)/i.test(d.image)){const x=new Image();x.alt=d.giftName||"Gift";x.referrerPolicy="no-referrer";x.onerror=()=>img.innerHTML='<div class="fallback">🎁</div>';x.src=d.image;img.appendChild(x)}else img.innerHTML='<div class="fallback">🎁</div>'}function render(d){const a=Array.isArray(d&&d.entries)?d.entries.slice(0,3):[],s=JSON.stringify(a.map(x=>[x.username,x.coins,x.giftName,x.image,x.updated]));if(s===sig)return;sig=s;entries=a;i=0;if(timer)clearInterval(timer);show();if(entries.length>1)timer=setInterval(()=>{i=(i+1)%entries.length;show()},6000)}function accept(o){if(o&&o.event==="message"&&o.message)try{render(JSON.parse(o.message))}catch{}}fetch(base+"/json?poll=1&since=latest&_="+Date.now(),{cache:"no-store"}).then(r=>r.text()).then(t=>t.trim().split(/\r?\n/).filter(Boolean).forEach(x=>{try{accept(JSON.parse(x))}catch{}})).catch(()=>{}).finally(()=>{const es=new EventSource(base+"/sse?since=latest");es.onmessage=e=>{try{accept(JSON.parse(e.data))}catch{}}})})();
</script></body></html>
